    <!-- Duitku POP Checkout Library (Sandbox) -->
    <script src="https://app-sandbox.duitku.com/lib/js/duitku.js"></script>
    <script>
      (function() {
        // Polyfill window.checkout.run jika pustaka mendefinisikan checkout.process
        function ensureCheckoutRun() {
          if (typeof window.checkout !== "undefined") {
            if (!window.checkout.run && typeof window.checkout.process === "function") {
              window.checkout.run = function(reference, options) {
                return window.checkout.process(reference, options || {});
              };
            }
          }
        }
        window.addEventListener("load", ensureCheckoutRun);
        setInterval(ensureCheckoutRun, 500);
      })();
    </script>
